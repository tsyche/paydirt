version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
      major:
        update-types: [major]
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    # Held back until the Expo SDK upgrade: react, react-native and their
    # types/companions are pinned by Expo and the pnpm override. Majors below
    # are untested (2026-09-25).
    ignore:
      - dependency-name: react
      - dependency-name: react-dom
      - dependency-name: react-native
      - dependency-name: "@types/react"
      - dependency-name: "@types/react-dom"
      - dependency-name: react-native-safe-area-context
      - dependency-name: pocketbase
      - dependency-name: "@babel/runtime"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      - dependency-name: eventsource
        update-types: ["version-update:semver-major"]
      - dependency-name: expo-image-picker
        update-types: ["version-update:semver-major"]
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      - dependency-name: vite
        update-types: ["version-update:semver-major"]
      - dependency-name: vitest
        update-types: ["version-update:semver-major"]
    groups:
      minor-and-patch:
        update-types: [minor, patch]
      major:
        update-types: [major]
